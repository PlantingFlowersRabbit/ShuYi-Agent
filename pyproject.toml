[project]
name = "novelvoice-agent"
version = "0.21.0"
description = "Harness-first novel dubbing assistant with v0.21 audio-generation controls and TTS stability updates."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]
backend = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "langchain>=0.3",
  "langchain-openai>=0.3",
  "python-dotenv>=1.0",
  "uvicorn[standard]>=0.30",
]
tts = [
  "python-multipart>=0.0.20",
  "soundfile>=0.12",
  "torch>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
