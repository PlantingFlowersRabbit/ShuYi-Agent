[project]
name = "shuyi-agent"
version = "0.7.1"
description = "Shuyi Agent novel dubbing assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]
backend = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "langchain>=0.3",
  "langchain-openai>=0.3",
  "langgraph>=0.2",
  "python-dotenv>=1.0",
  "regex>=2024.11",
  "uvicorn[standard]>=0.30",
]
tts = [
  "python-multipart>=0.0.20",
  "soundfile>=0.12",
  "torch>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
