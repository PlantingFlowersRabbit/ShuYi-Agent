name: Build and publish frontend to gh-pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_PAGES_BASE_URL: /ShuYi-Agent/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - name: Publish static frontend
        run: |
          set -euo pipefail

          publish_dir="$(mktemp -d)"
          worktree_dir="$(mktemp -d)"
          rm -rf "$worktree_dir"

          cp -R frontend/dist/. "$publish_dir/"
          touch "$publish_dir/.nojekyll"

          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add --detach "$worktree_dir" origin/gh-pages
            git -C "$worktree_dir" checkout -B gh-pages origin/gh-pages
          else
            git worktree add --detach "$worktree_dir"
            git -C "$worktree_dir" checkout --orphan gh-pages
          fi

          git -C "$worktree_dir" rm -rf . >/dev/null 2>&1 || true
          cp -R "$publish_dir"/. "$worktree_dir/"
          git -C "$worktree_dir" add -A
          git -C "$worktree_dir" config user.name "github-actions[bot]"
          git -C "$worktree_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git -C "$worktree_dir" diff --cached --quiet; then
            echo "No frontend changes to publish."
          else
            git -C "$worktree_dir" commit -m "deploy: frontend"
            git -C "$worktree_dir" push origin gh-pages
          fi

          git worktree remove "$worktree_dir" --force
