services:
  qdrant:
    image: qdrant/qdrant:v1.12.6
    ports:
      - "127.0.0.1:${SHUYI_QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-lc", "</dev/tcp/127.0.0.1/6333"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  qdrant-data:
