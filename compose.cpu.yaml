services:
  shuyi-agent:
    build:
      context: .
      target: cpu-runtime
    environment:
      NOVELVOICE_DATA_DIR: /data
      NOVELVOICE_DEVICE: cpu
      NOVELVOICE_MODEL_AUTO_DOWNLOAD: "${NOVELVOICE_MODEL_AUTO_DOWNLOAD:-1}"
      NOVELVOICE_MODEL_DIR: /models
      QWEN3_TTS_DEVICE: cpu
      QWEN3_TTS_MODEL_PATH: /models/Qwen3-TTS-12Hz-1.7B-Base
      QWEN3_TTS_VOICE_DESIGN_MODEL_PATH: /models/Qwen3-TTS-12Hz-1.7B-VoiceDesign
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - novelvoice-data:/data
      - novelvoice-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5m
    restart: unless-stopped

volumes:
  novelvoice-data:
  novelvoice-models:
