services:
  shuyi-agent:
    build:
      context: .
      target: cuda-runtime
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      NVIDIA_VISIBLE_DEVICES: all
      SHUYI_DATA_DIR: /data
      SHUYI_DEVICE: cuda
      SHUYI_MODEL_AUTO_DOWNLOAD: "${SHUYI_MODEL_AUTO_DOWNLOAD:-1}"
      SHUYI_MODEL_DIR: /models
      QWEN3_TTS_DEVICE: cuda
      QWEN3_TTS_MODEL_PATH: /models/Qwen3-TTS-12Hz-1.7B-Base
      QWEN3_TTS_VOICE_DESIGN_MODEL_PATH: /models/Qwen3-TTS-12Hz-1.7B-VoiceDesign
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - shuyi-data:/data
      - shuyi-models:/models
    stop_grace_period: 40s
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              driver: nvidia
              count: all
    healthcheck:
      test: ["CMD", "python", "/app/scripts/container/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5m
    restart: unless-stopped

volumes:
  shuyi-data:
  shuyi-models:
