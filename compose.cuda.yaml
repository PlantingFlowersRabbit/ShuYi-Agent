services:
  shuyi-agent:
    build:
      context: .
      target: cuda-runtime
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      NVIDIA_VISIBLE_DEVICES: all
      SHUYI_DATA_DIR: /data
      SHUYI_DEVICE: cuda
      SHUYI_REQUIRE_TTS_READY: "0"
      SHUYI_CORS_ORIGINS: "${SHUYI_CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,https://plantingflowersrabbit.github.io}"
      SHUYI_CORS_ORIGIN_REGEX: '${SHUYI_CORS_ORIGIN_REGEX:-https://.*\.cnb\.run}'
      SHUYI_MODEL_AUTO_DOWNLOAD: "${SHUYI_MODEL_AUTO_DOWNLOAD:-0}"
      SHUYI_MODEL_DIR: /models
      QWEN3_TTS_DEVICE: cuda
      QWEN3_TTS_MODEL_PATH: /models/Qwen3-TTS-12Hz-1.7B-Base
      QWEN3_TTS_VOICE_DESIGN_MODEL_PATH: /models/Qwen3-TTS-12Hz-1.7B-VoiceDesign
    env_file:
      - path: .env
        required: false
    ports:
      - "0.0.0.0:${SHUYI_HOST_PORT:-8000}:8000"
    volumes:
      - shuyi-data:/data
      - shuyi-models:/models
    stop_grace_period: 40s
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              driver: nvidia
              count: all
    healthcheck:
      test: ["CMD", "python", "/app/scripts/container/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5m
    restart: unless-stopped

volumes:
  shuyi-data:
  shuyi-models:
